<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">

<style>
:root{color-scheme:dark;--bg:#0b1020}

<body>

    </div>
  </div>

<div id="res" class="fixed inset-0 hidden grid place-items-center bg-slate-950/60 p-4">

    <div class="grid grid-cols-2 gap-2"><button id="again" class="rounded-xl py-3 font-bold tracking-widest bg-gradient-to-r from-cyan-500 to-pink-500">再比一次</button><button id="back" class="rounded-xl py-3 font-bold tracking-widest glass">返回選單</button></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id),LAPS=1,W=13,CURB=2.2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),wd=a=>Math.atan2(Math.sin(a),Math.cos(a));
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,matchMedia('(pointer:coarse)').matches?1.5:2));

const cam=new THREE.PerspectiveCamera(70,1,1,1200);
const hemi=new THREE.HemisphereLight(0xffffff,0x3a5a2a,.95),sun=new THREE.DirectionalLight(0xfff2cc,.8);sun.position.set(100,200,60);scene.add(hemi,sun);

const gr=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.MeshLambertMaterial({color:0x3f8f3f}));gr.rotation.x=-Math.PI/2;gr.position.y=-.1;scene.add(gr);

/* ---------- maps ---------- */
const mix=(a,b,t)=>{t=clamp(t,0,1);return a.map((v,i)=>v+(b[i]-v)*t)},nz=(x,z)=>.5+.5*Math.sin(x*.071+Math.sin(z*.043)*2)*Math.sin(z*.059);
const MAPS=[
 {n:'翠綠森林',d:'起伏丘陵 · 茂密林地 · 平順彎道',lv:1,s:1.7,sky:0x8fd0ff,gr:0x2f6b34,hg:0x3a5a2a,road:[.17,.18,.21],li:[.95,.8],deco:'forest',
  hf:(x,z)=>Math.max(0,16+15*Math.sin(x*.011+1)*Math.cos(z*.013)+9*Math.sin(x*.027+z*.021)),
  tc:(h,x,z)=>mix(mix([.27,.58,.26],[.14,.36,.2],h/34),[.2,.45,.2],nz(x,z)*.6),
  pts:[[0,-120],[90,-120],[150,-60],[120,10],[160,80],[100,140],[20,110],[-40,150],[-120,110],[-140,30],[-90,-30],[-130,-90],[-70,-130]]},
 {n:'霓虹都市',d:'摩天大樓 · 超長直道 · 夜間賽道',lv:2,s:1.5,sky:0x0a0f24,gr:0x0d1220,hg:0x1a2038,road:[.09,.1,.14],li:[.55,.3],deco:'city',
  hf:()=>0,tc:(h,x,z)=>mix([.07,.09,.15],[.11,.13,.2],nz(x,z)),
  pts:[[-180,-60],[-60,-60],[60,-60],[160,-70],[200,-10],[160,50],[60,40],[-20,60],[-60,120],[-140,150],[-200,100],[-210,20]]},
 {n:'雪山隧道',d:'高聳雪山 · 長隧道 · 蛇形急彎',lv:3,s:1.3,sky:0xcfe4f5,gr:0xf0f5f9,hg:0xaebfcc,road:[.2,.22,.26],li:[1,.7],deco:'snow',tunnel:1,
  hf:(x,z)=>Math.max(0,38+30*Math.sin(x*.009)*Math.cos(z*.011)+16*Math.sin(x*.023-z*.017)+8*Math.sin(x*.05+z*.04)),

 {n:'陽光海灘',d:'海岸公路 · 棕櫚樹 · 連續 S 彎',lv:2,s:1.6,sky:0x7fd4ff,gr:0xe8d49b,hg:0xc9b077,road:[.2,.2,.22],li:[1,.9],deco:'beach',water:1,
  hf:(x,z,b)=>3+2.5*Math.sin(x*.03)*Math.cos(z*.025)-Math.max(0,z-(b.z1-40))*.25,
  tc:(h,x,z)=>h<-1.6?[.1,.38,.5]:h<.7?[.78,.68,.45]:mix([.93,.84,.6],[.88,.78,.52],nz(x,z)),
  pts:[[0,-130],[100,-130],[170,-80],[170,0],[120,50],[160,110],[90,160],[0,130],[-60,160],[-140,120],[-160,40],[-110,0],[-160,-60],[-100,-120]]}];
MAPS[0].hl=[5,7,4,2];MAPS[1].hl=[3,4,2,1];MAPS[2].hl=[9,11,6,3];MAPS[3].hl=[2.5,2.5,1.5,1];MAPS[3].hb=4;
let TU=null,WIN=null,carType=0,carCol=0xe31b0c,mstep=0,ST=[4,3,4,3];const PREV=[];
let N,ds,P,T,Nm,SP,RO,WLL,WLR,CEN,MM,DM,HY,curMap=0;
function inst(geo,mat,it){if(!it.length)return;const m=new THREE.InstancedMesh(geo,mat,it.length),d=new THREE.Object3D(),c=new THREE.Color();let hc=false;
  it.forEach((o,i)=>{d.position.set(o.x,o.y,o.z);d.rotation.set(o.rx||0,o.ry||0,o.rz||0);d.scale.set(o.sx,o.sy==null?o.sx:o.sy,o.sz==null?o.sx:o.sz);d.updateMatrix();m.setMatrixAt(i,d.matrix);if(o.c!=null){m.setColorAt(i,c.set(o.c));hc=true}});
  if(hc)m.instanceColor.needsUpdate=true;m.frustumCulled=false;TG.add(m);return m}

  for(let i=i0;i<i1;i++)for(let k=0;k<K;k++){const t0=k/K*Math.PI,t1=(k+1)/K*Math.PI;[q(i,t0),q(i,t1),q(i+1,t1),q(i,t0),q(i+1,t1),q(i+1,t0)].forEach(v=>pos.push(...v))}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();return new THREE.Mesh(g,mat)}
function ringMesh(i,a1,h1,a2,h2,mat){const pos=[],K=16,p=P[i%N],n=Nm[i%N],q=(a,h,t)=>[p.x+n.x*Math.cos(t)*a,Math.sin(t)*h+HY[i%N],p.z+n.z*Math.cos(t)*a];
  for(let k=0;k<K;k++){const t0=k/K*Math.PI,t1=(k+1)/K*Math.PI;[q(a1,h1,t0),q(a1,h1,t1),q(a2,h2,t1),q(a1,h1,t0),q(a2,h2,t1),q(a2,h2,t0)].forEach(v=>pos.push(...v))}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();return new THREE.Mesh(g,mat)}
const TG=new THREE.Group();scene.add(TG);
const rc=i=>Math.floor(i/4)%2?[.9,.15,.2]:[.95,.95,.95];
function ribbon(a,b,y,col){const pos=[],cl=[];for(let i=0;i<N;i++){const j=(i+1)%N,c=col(i);if(!c)continue;

  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(cl,3));g.computeVertexNormals();
  TG.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide})))}
function buildScenery(M,x0,x1,z0,z1){
  const mg=300,xa=x0-mg,xb=x1+mg,za=z0-mg,zb=z1+mg,GX=110,GZ=110,B={x0,x1,z0,z1},R_=Math.random;
  const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
